<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Noor ✨</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,500&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --night: #0c1524;
    --night-2: #14213a;
    --moon: #fdf6e8;
    --gold: #e6b45c;
    --blush: #f0a6a6;
    --lavender: #b9a4f0;
    --mist: rgba(253,246,232,0.65);
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html,body{
    height:100%;
    background: radial-gradient(ellipse at 50% 20%, var(--night-2) 0%, var(--night) 70%);
    font-family: 'Poppins', sans-serif;
    color: var(--moon);
    overflow-x:hidden;
  }

  #sky{
    position:fixed;
    inset:0;
    z-index:0;
  }

  .wrap{
    position:relative;
    z-index:2;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding: 6vh 6vw;
  }

  .eyebrow{
    font-size:0.72rem;
    letter-spacing:0.35em;
    text-transform:uppercase;
    color: var(--gold);
    font-weight:500;
    margin-bottom: 1.6rem;
    opacity:0;
    animation: fadeUp 1s ease forwards 0.2s;
  }

  .moon{
    width: 92px;
    height: 92px;
    border-radius:50%;
    background: radial-gradient(circle at 35% 32%, #fffdf5 0%, var(--gold) 55%, #b9852c 100%);
    box-shadow: 0 0 40px 10px rgba(230,180,92,0.35), 0 0 90px 30px rgba(230,180,92,0.12);
    margin-bottom: 2.2rem;
    opacity:0;
    animation: fadeUp 1.1s ease forwards 0.4s, glow 4s ease-in-out infinite 1.6s;
    transition: box-shadow 0.6s ease, transform 0.6s ease;
  }

  .moon:hover{
    box-shadow: 0 0 60px 18px rgba(230,180,92,0.55), 0 0 140px 50px rgba(230,180,92,0.22);
    transform: scale(1.05);
  }

  @keyframes glow{
    0%,100%{ filter: brightness(1); }
    50%{ filter: brightness(1.15); }
  }

  h1{
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: clamp(2.4rem, 7vw, 4.4rem);
    line-height:1.05;
    letter-spacing: 0.01em;
    opacity:0;
    animation: fadeUp 1s ease forwards 0.6s;
  }

  h1 em{
    font-style: italic;
    color: var(--gold);
  }

  .sub{
    max-width: 480px;
    margin: 1.6rem auto 0;
    font-size: 1.02rem;
    font-weight:300;
    line-height:1.75;
    color: var(--mist);
    opacity:0;
    animation: fadeUp 1s ease forwards 0.85s;
  }

  .sub b{
    color: var(--blush);
    font-weight:500;
  }

  .meaning{
    margin-top: 0.9rem;
    font-size: 0.85rem;
    font-style: italic;
    color: var(--lavender);
    font-family: 'Cormorant Garamond', serif;
    opacity:0;
    animation: fadeUp 1s ease forwards 1s;
  }

  .card{
    margin-top: 3.2rem;
    display:flex;
    gap: 1.1rem;
    flex-wrap: wrap;
    justify-content:center;
    opacity:0;
    animation: fadeUp 1s ease forwards 1.2s;
  }

  button{
    font-family:'Poppins', sans-serif;
    font-size: 0.95rem;
    font-weight:500;
    padding: 0.95rem 2.3rem;
    border-radius: 999px;
    border: none;
    cursor:pointer;
    transition: transform 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
  }

  #yes{
    background: linear-gradient(135deg, var(--gold), #d99a3f);
    color: #241605;
    box-shadow: 0 6px 24px rgba(230,180,92,0.35);
  }
  #yes:hover{
    transform: translateY(-3px);
    box-shadow: 0 10px 32px rgba(230,180,92,0.5);
  }

  #maybe{
    background: transparent;
    color: var(--mist);
    border: 1px solid rgba(253,246,232,0.3);
    position:relative;
  }
  #maybe:hover{
    border-color: rgba(253,246,232,0.6);
  }

  .result{
    margin-top: 2.6rem;
    font-family:'Cormorant Garamond', serif;
    font-size: 1.4rem;
    font-style: italic;
    color: var(--blush);
    min-height: 2rem;
    opacity:0;
    transition: opacity 0.6s ease;
  }

  .result.show{ opacity:1; }

  .footer-note{
    position:absolute;
    bottom: 2rem;
    font-size: 0.7rem;
    letter-spacing:0.1em;
    color: rgba(253,246,232,0.35);
    text-transform:uppercase;
  }

  @keyframes fadeUp{
    from{ opacity:0; transform: translateY(14px); }
    to{ opacity:1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<canvas id="sky"></canvas>

<div class="wrap">
  <div class="eyebrow">a small message, sent quietly</div>
  <div class="moon"></div>
  <h1>Every sky<br>needs its <em>Noor</em>.</h1>
  <p class="sub">I don't know if you've noticed, but talking to you is the kind of thing that makes a day feel a little lighter. So — no pressure, no big speech — <b>just an honest ask.</b></p>
  <p class="meaning">noor (نور) — light, radiance, glow.</p>

  <div class="card">
    <button id="yes">Yes, let's be friends 🤍</button>
    <button id="maybe">Maybe, ask me later</button>
  </div>

  <div class="result" id="result"></div>

  <div class="footer-note">made with a little bit of courage</div>
</div>

<script>
  // starfield
  const canvas = document.getElementById('sky');
  const ctx = canvas.getContext('2d');
  let stars = [];

  function resize(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    const count = Math.floor((canvas.width * canvas.height) / 9000);
    stars = Array.from({length: count}, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: Math.random() * 1.3 + 0.3,
      phase: Math.random() * Math.PI * 2,
      speed: 0.015 + Math.random() * 0.02
    }));
  }
  window.addEventListener('resize', resize);
  resize();

  function draw(t){
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for(const s of stars){
      const twinkle = 0.5 + 0.5 * Math.sin(t * s.speed + s.phase);
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(253,246,232,${0.15 + twinkle * 0.55})`;
      ctx.fill();
    }
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);

  // interactions
  const result = document.getElementById('result');
  const yesBtn = document.getElementById('yes');
  const maybeBtn = document.getElementById('maybe');

  yesBtn.addEventListener('click', () => {
    result.textContent = "That's it — that's the whole message. Thank you, Noor. ✨";
    result.classList.add('show');
    burst();
  });

  maybeBtn.addEventListener('click', () => {
    result.textContent = "Take your time. The offer doesn't come with an expiry date.";
    result.classList.add('show');
  });

  function burst(){
    const colors = ['#e6b45c', '#f0a6a6', '#b9a4f0', '#fdf6e8'];
    for(let i = 0; i < 26; i++){
      const p = document.createElement('div');
      const size = 5 + Math.random() * 5;
      p.style.position = 'fixed';
      p.style.left = '50%';
      p.style.top = '55%';
      p.style.width = size + 'px';
      p.style.height = size + 'px';
      p.style.borderRadius = '50%';
      p.style.background = colors[Math.floor(Math.random() * colors.length)];
      p.style.pointerEvents = 'none';
      p.style.zIndex = 5;
      document.body.appendChild(p);

      const angle = Math.random() * Math.PI * 2;
      const dist = 120 + Math.random() * 220;
      const dx = Math.cos(angle) * dist;
      const dy = Math.sin(angle) * dist - 80;

      p.animate([
        { transform: 'translate(-50%,-50%) translate(0,0)', opacity: 1 },
        { transform: `translate(-50%,-50%) translate(${dx}px, ${dy}px)`, opacity: 0 }
      ], {
        duration: 1100 + Math.random() * 500,
        easing: 'cubic-bezier(.2,.7,.3,1)'
      }).onfinish = () => p.remove();
    }
  }
</script>

</body>
</html>
